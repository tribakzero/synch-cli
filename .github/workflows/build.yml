name: Build and publish Synch CLI

on:
  workflow_dispatch:

  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/synch-cli

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build files
        uses: actions/checkout@v6

      - name: Checkout upstream repository
        uses: actions/checkout@v6
        with:
          repository: hjinco/synch
          ref: main
          path: source

      - name: Get upstream commit
        id: source
        working-directory: source
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare build context
        run: cp Dockerfile source/Dockerfile

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./source
          file: ./source/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.source.outputs.sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/hjinco/synch
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
